apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: libreserve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/libreserve/libreserve-backend:dev
        env:
            - name: NODE_ENV
              value: "production"
            - name: FRONTEND_URL
              value: "https://dev-coe.ionize13.com"
            - name: GOOGLE_CLIENT_ID
              value: "336497013992-n2rfrnbmvfjm7toipruvbau5lu3sqmk0.apps.googleusercontent.com"
            - name: AWS_REGION
              value: "ap-southeast-2"
            - name: S3_BUCKET_NAME
              value: "dev-coe-workshop"
            - name: S3_BUCKET_PUBLIC
              value: "true"
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: GOOGLE_CLIENT_SECRET
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SESSION_SECRET
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: libreserve-cluster-app
                  key: uri
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: libreserve
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080


